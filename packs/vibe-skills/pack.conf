# packs/vibe-skills/pack.conf — pack METADATA, sourced by the root install.sh (pack
# discovery, --list, default dest) and by this pack's install.sh. Contract:
# packs/README.md. The install logic itself (payload dirs, hooks, cleanup) lives in
# packs/vibe-skills/install.sh.
PACK_NAME=vibe-skills
PACK_DESCRIPTION="Mistral Vibe skills — a repo of Agent Skills (SKILL.md) installed as user-level skills in the Vibe home; publishable to the cloud Vibe registry (see docs/local-and-cloud.md)"
PACK_DEFAULT_DEST="${VIBE_HOME:-$HOME/.vibe}"
PACK_META_PREFIX="agent-packs.vibe-skills"
# no hard prerequisites: installing skill files is harmless without the CLI
# (the warnings in install.sh cover the soft requirements)
PACK_PREREQS=""
