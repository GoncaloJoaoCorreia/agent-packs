# packs/vibe-skills/pack.conf — installed by the root install.sh. Contract: packs/README.md
PACK_NAME=vibe-skills
PACK_DESCRIPTION="Mistral Vibe skills — a repo of Agent Skills (SKILL.md) installed as user-level skills in the Vibe home; publishable to the cloud Vibe registry (see docs/local-and-cloud.md)"
PACK_DEFAULT_DEST="${VIBE_HOME:-$HOME/.vibe}"
PACK_META_PREFIX="agent-packs.vibe-skills"
# copied to the dest root (copy-based on purpose): skills/ lands at
# ${VIBE_HOME:-~/.vibe}/skills/ — Vibe's user-level skill discovery path
PACK_PAYLOAD="skills"
# no hard prerequisites: installing skill files is harmless without the CLI
# (the warnings below cover the soft requirements)
PACK_PREREQS=""

# optional warnings, printed before install (never fail)
pack_extra_checks() {
  if ! command -v vibe >/dev/null 2>&1 && ! command -v vibe-acp >/dev/null 2>&1; then
    echo "install.sh: warning: no Mistral Vibe CLI (vibe) on PATH — skills land in ${VIBE_HOME:-$HOME/.vibe}/skills but nothing loads them until the CLI is installed" >&2
  fi
  if [ -z "${MISTRAL_API_KEY:-}" ]; then
    echo "install.sh: note: MISTRAL_API_KEY is not set — cloud publishing (scripts/publish-to-cloud.py in this pack) will not work; the local install is unaffected" >&2
  fi
}

# printed after a successful install of this pack
pack_next_steps() {
  cat <<'EOF'

Next steps:
  1. In Vibe run /reload (or start a new session) — the skills show up in /skills as user-level skills
  2. Invoke one with /<skill-name>; the model can also pick skills by their description
  3. Publish to cloud Vibe (Vibe Work / cloud sessions): from the repo root run
       MISTRAL_API_KEY=... python3 packs/vibe-skills/scripts/publish-to-cloud.py --apply
     then Share (workspace) + "Publish to Vibe" in Studio — see packs/vibe-skills/docs/local-and-cloud.md
EOF
}
