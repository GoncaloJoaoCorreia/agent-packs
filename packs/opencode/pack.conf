# packs/opencode/pack.conf — installed by the root install.sh. Contract: packs/README.md
PACK_NAME=opencode
PACK_DESCRIPTION="OpenCode v2 — /driver feature cycle (agents, commands, skills) + driver-viz TUI plugin"
PACK_DEFAULT_DEST="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
PACK_META_PREFIX="agent-packs.opencode"
# one-time cleanup of pre-rename installs (the repo was opencode-agents before)
PACK_LEGACY_MANIFEST="opencode-agents.manifest"
PACK_LEGACY_CLEANUP="opencode-agents.version"
# copied to the dest root (copy-based on purpose; 'plugins' is skipped by --no-plugin)
PACK_PAYLOAD="agents commands plugins agent-scripts skills"
# shipped in the release tarball but NOT installed into the config dir
PACK_SHIP_ONLY="snippets"
# hard prerequisites (checked before anything is installed)
PACK_PREREQS="python3 git"

# optional warnings, printed before install (never fail)
pack_extra_checks() {
  # optional: a forge CLI is only needed by the driver's pr phase (it degrades
  # gracefully without one)
  if ! command -v gh >/dev/null 2>&1 && ! command -v glab >/dev/null 2>&1 \
     && ! command -v forgejo-cli >/dev/null 2>&1 && ! command -v fj >/dev/null 2>&1; then
    echo "install.sh: note: no forge CLI (gh/glab/forgejo-cli) found — optional; the driver's pr phase will skip pushing/opening the PR without one" >&2
  fi
  # optional: the driver reads Linear issues through the linear-project MCP server —
  # warn (never fail) when it is not configured at user level; a repo-level
  # opencode.jsonc also works at runtime
  user_cfg="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
  if ! grep -qs 'linear-project\|mcp\.linear\.app' "$user_cfg/opencode.json" "$user_cfg/opencode.jsonc" 2>/dev/null; then
    echo "install.sh: warning: no Linear MCP server (linear-project) in your user-level OpenCode config ($user_cfg/opencode.json / opencode.jsonc)" >&2
    echo "  the driver needs it to read Linear issues — add it to your user-level or repo-level opencode config:" >&2
    echo '  { "mcp": { "linear-project": { "type": "remote", "url": "https://mcp.linear.app/mcp", "enabled": true } } }' >&2
  fi
}

# printed after a successful install of this pack
pack_next_steps() {
  cat <<'EOF'

Next steps:
  1. Add '.plan/' to the .gitignore of every repo you run /driver in (ready-made line in snippets/gitignore.txt)
  2. Get started from a repo root in OpenCode: /driver ABC-123
EOF
}
