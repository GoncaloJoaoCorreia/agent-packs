# packs/open-driver/pack.conf — pack METADATA, sourced by the root install.sh (pack
# discovery, --list, default dest) and by this pack's install.sh. Contract:
# packs/README.md. The install logic itself (payload dirs, hooks, cleanup) lives in
# packs/open-driver/install.sh.
PACK_NAME=open-driver
PACK_DESCRIPTION="OpenCode v2 — /driver feature cycle (agents, commands, skills) + driver-viz TUI plugin"
PACK_DEFAULT_DEST="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
PACK_META_PREFIX="agent-packs.open-driver"
# hard prerequisites (checked before anything is installed)
PACK_PREREQS="python3 git"
# one-time cleanup of pre-rename installs (the repo was opencode-agents, and the pack
# was named opencode before this rename)
PACK_LEGACY_MANIFEST="opencode-agents.manifest agent-packs.opencode.manifest"
PACK_LEGACY_CLEANUP="opencode-agents.version agent-packs.opencode.version"
