# packs/vibe-acp/pack.conf — installed by the root install.sh. Contract: packs/README.md
PACK_NAME=vibe-acp
PACK_DESCRIPTION="Mistral Vibe as an OpenCode provider — vibe-acp over ACP (server plugin + provider runtime package), no OpenCode fork"
PACK_DEFAULT_DEST="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
PACK_META_PREFIX="agent-packs.vibe-acp"
# copied to the dest root (copy-based on purpose; 'plugins' is skipped by --no-plugin).
# OpenCode auto-discovers <config>/plugins/vibe-acp/ — no config edit needed.
PACK_PAYLOAD="plugins"
# shipped in the release tarball but NOT installed into the config dir
PACK_SHIP_ONLY="snippets"
# hard prerequisites (checked before anything is installed). The pack itself needs no build;
# the provider spawns the vibe CLI at runtime (warned about below, never hard-failed).
PACK_PREREQS="git"

# optional warnings, printed before install (never fail)
pack_extra_checks() {
  if ! command -v vibe-acp >/dev/null 2>&1 && ! command -v vibe >/dev/null 2>&1; then
    echo "install.sh: warning: no Mistral Vibe CLI (vibe-acp / vibe) on PATH — the 'vibe' provider stays disabled until one is installed and signed in (vibe-acp --setup)" >&2
  fi
  if ! command -v node >/dev/null 2>&1 && ! command -v bun >/dev/null 2>&1; then
    echo "install.sh: warning: no node/bun runtime visible — OpenCode itself provides the runtime, this is informational only" >&2
  fi
}

# printed after a successful install of this pack
pack_next_steps() {
  cat <<'EOF'

Next steps:
  1. Sign in once with the Vibe CLI: vibe-acp --setup   (or /connect → "Sign in with Vibe CLI" in OpenCode)
  2. In OpenCode run /models and pick a vibe/<model> — models are discovered from the CLI automatically
  3. Select it with "model": "vibe/<model>" (see snippets/opencode.jsonc in this repo)
  Note: Mistral's consumer ToS §3(g) forbids integrating Vibe with third-party products without
  prior written authorization — personal use via ACP is fine; get Mistral's OK before distributing.
EOF
}
