# packs/vibe-acp/pack.conf — pack METADATA, sourced by the root install.sh (pack
# discovery, --list, default dest) and by this pack's install.sh. Contract:
# packs/README.md. The install logic itself (payload dirs, hooks, cleanup) lives in
# packs/vibe-acp/install.sh.
PACK_NAME=vibe-acp
PACK_DESCRIPTION="Mistral Vibe as an OpenCode provider — vibe-acp over ACP (server plugin + provider runtime package), no OpenCode fork"
PACK_DEFAULT_DEST="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
PACK_META_PREFIX="agent-packs.vibe-acp"
# hard prerequisites (checked before anything is installed). The pack itself needs no
# build; the provider spawns the vibe CLI at runtime (warned about in install.sh,
# never hard-failed).
PACK_PREREQS="git"
