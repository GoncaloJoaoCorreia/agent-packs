name: release

# Manifest release pipeline (G-113 M2):
#   1. validate the repo (./scripts/validate.sh)
#   2. classify the push diff (scripts/release-detect.sh, baseline = previous main SHA,
#      fallback latest v* tag): packs/<name>/** payload paths -> that pack; infra paths
#      (install.sh, scripts/**, workflows, packs/README.md) -> all packs; docs-only ->
#      exit 0, no release
#   3. per changed pack run pack-owned packs/<name>/scripts/release.sh: per-pack version
#      from conventional commits since the latest v* tag (feat->minor, fix->patch,
#      !/BREAKING CHANGE:->major, highest wins, no-prefix->patch; seeded from the latest
#      v* tag), build packs/<name>.tar.gz (payload + pack.conf + install.sh + vendored
#      install-lib.sh, repo-only stripped) + a meta fragment {version, description,
#      asset, sha256}. vibe-skills' release.sh also publishes to the cloud registry
#      (MISTRAL_API_KEY unset -> warn + skip)
#   4. assemble manifest.json (scripts/assemble-manifest.py); unchanged packs carry their
#      entry + tarball over from the previous release, so every release is self-contained
#   5. tag vX.Y.Z (auto patch-bump of the latest v* tag; aborts if the tag exists) + push
#   6. gh release create <tag> manifest.json packs/*.tar.gz
#   7. self-test: after the latest pointer settles, install each changed pack from the new
#      release into mktemp dests via the installer's release mode, assert meta files +
#      versions, verify tarball checksums against the manifest, grep tarballs for
#      repo-only paths
on:
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - 'install.sh'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version as vX.Y.Z (or X.Y.Z). Empty = auto-increment patch from the latest tag."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false  # queue releases instead of cancelling

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install node for driver-viz tests
        uses: actions/setup-node@v5
        with:
          node-version: "22" # validate.sh needs >= 22.18 to strip TS types without a flag

      - name: Install validation deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ruby

      - name: Validate repository
        run: ./scripts/validate.sh

      - name: Detect changed packs
        id: detect
        env:
          BASELINE: ${{ github.event.before }}
        run: |
          set -eu
          before="${BASELINE:-}"
          # a zero SHA (new branch) or a missing object -> fall back to the latest v* tag
          if [ -n "$before" ] && { [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; }; then
            before=""
          fi
          out=$(REPO_ROOT="$PWD" BASELINE="$before" sh scripts/release-detect.sh)
          echo "$out"
          release=$(printf '%s\n' "$out" | sed -n 's/^release=//p')
          packs=$(printf '%s\n' "$out" | sed -n 's/^packs=//p')
          # shellcheck disable=SC2086  # re-split to trim leading/trailing whitespace
          packs=$(printf '%s\n' $packs)
          if [ "${release:-0}" = "1" ] && [ "$packs" = "all" ]; then
            packs=$(for c in packs/*/pack.conf; do basename "$(dirname "$c")"; done | LC_ALL=C sort | paste -sd' ' -)
          fi
          echo "release=${release:-0}" >> "$GITHUB_OUTPUT"
          echo "packs=${packs:-}" >> "$GITHUB_OUTPUT"
          if [ "${release:-0}" = "1" ]; then
            echo "changed packs: $packs"
          else
            echo "docs-only diff — no release"
          fi

      - name: Build changed pack artifacts
        if: ${{ steps.detect.outputs.release == '1' }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -eu
          mkdir -p artifacts
          for p in ${{ steps.detect.outputs.packs }}; do
            REPO_ROOT="$PWD" OUT_DIR="$PWD/artifacts" MISTRAL_API_KEY="${MISTRAL_API_KEY:-}" \
              sh "packs/$p/scripts/release.sh"
          done
          ls -la artifacts artifacts/packs

      - name: Carry over unchanged packs from the previous release
        if: ${{ steps.detect.outputs.release == '1' }}
        run: |
          set -eu
          prev_tag=$(git tag -l 'v*' | sort -V | tail -n 1 || true)
          if [ -z "$prev_tag" ]; then
            echo "no previous v* tag — manifest lists only the changed packs"
            exit 0
          fi
          base="https://github.com/${{ github.repository }}/releases/download/$prev_tag"
          if ! curl -fsSL "$base/manifest.json" -o artifacts/manifest.prev.json; then
            echo "previous release $prev_tag has no manifest.json (pre-manifest release) — manifest lists only the changed packs"
            exit 0
          fi
          PREV_TAG="$prev_tag" python3 - artifacts/manifest.prev.json artifacts "${{ steps.detect.outputs.packs }}" <<'PY'
          import json, os, sys, urllib.request
          prev_path, out_dir, changed = sys.argv[1], sys.argv[2], sys.argv[3].split()
          doc = json.load(open(prev_path))
          prev = doc["packs"]
          # GitHub release assets are bare filenames; manifests written before that fix
          # may carry "packs/<name>.tar.gz" paths, which 404 on download — normalize to the
          # basename for both the download and the carried-over manifest entry
          for e in prev.values():
              e["asset"] = os.path.basename(e.get("asset", ""))
          json.dump(doc, open(prev_path, "w"), indent=2, sort_keys=True, ensure_ascii=False)
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['PREV_TAG']}"
          all_packs = sorted(d for d in os.listdir("packs") if os.path.isfile(f"packs/{d}/pack.conf"))
          for name in all_packs:
              if name in changed or name not in prev:
                  continue
              asset = prev[name]["asset"]
              dest = os.path.join(out_dir, "packs", asset)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              print(f"carrying over {name} {prev[name]['version']} ({asset}) from {os.environ['PREV_TAG']}")
              urllib.request.urlretrieve(f"{base}/{asset}", dest)
          PY

      - name: Compute release version
        id: version
        if: ${{ steps.detect.outputs.release == '1' }}
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -eu
          git fetch --tags --force
          latest=$(git tag -l 'v*' | sort -V | tail -n 1 || true)

          normalize() { # any vX.Y / vX.Y.Z / X.Y.Z -> vX.Y.Z
            local v="${1#v}"
            case "$v" in
              [0-9]*.[0-9]*.[0-9]*) printf 'v%s\n' "$v" ;;
              [0-9]*.[0-9]*)       printf 'v%s.0\n' "$v" ;;
              *) return 1 ;;
            esac
          }

          if [ -n "$VERSION_INPUT" ]; then
            if ! printf '%s' "$VERSION_INPUT" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "invalid version '$VERSION_INPUT': must be vX.Y.Z or X.Y.Z" >&2
              exit 1
            fi
            new=$(normalize "$VERSION_INPUT")
            if git rev-parse -q --verify "refs/tags/$new" >/dev/null 2>&1; then
              echo "tag $new already exists" >&2
              exit 1
            fi
            if [ -n "$latest" ]; then
              latest_n=$(normalize "$latest")
              if [ "$new" = "$latest_n" ] || [ "$new" = "$(printf '%s\n%s\n' "$latest_n" "$new" | sort -V | head -n 1)" ]; then
                echo "$new is not greater than the latest tag $latest_n" >&2
                exit 1
              fi
            fi
          else
            if [ -n "$latest" ]; then
              latest_n=$(normalize "$latest")
              set -- $(printf '%s' "${latest_n#v}" | tr '.' ' ')
              new="v$1.$2.$(( $3 + 1 ))"
            else
              new="v0.1.0"
            fi
          fi

          echo "latest=${latest:-none}" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "new tag: $new (latest was: ${latest:-none})"

      - name: Assemble manifest.json
        if: ${{ steps.detect.outputs.release == '1' }}
        run: |
          set -eu
          tag_version="${{ steps.version.outputs.version }}"
          prev_args=""
          if [ -f artifacts/manifest.prev.json ]; then
            prev_args="--prev-manifest artifacts/manifest.prev.json"
          fi
          python3 scripts/assemble-manifest.py --out artifacts/manifest.json \
            --release "$tag_version" --artifacts artifacts \
            --changed "${{ steps.detect.outputs.packs }}" \
            --repo-root "$PWD" $prev_args
          cat artifacts/manifest.json

      - name: Create and push tag
        id: tag
        if: ${{ steps.detect.outputs.release == '1' }}
        run: |
          set -eu
          tag="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists — aborting" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pushed tag $tag"

      - name: Create GitHub release
        if: ${{ steps.detect.outputs.release == '1' }}
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          latest="${{ steps.version.outputs.latest }}"
          if [ "$latest" != "none" ]; then
            header="Changes since $latest"
            body=$(git log --oneline "${latest}..HEAD")
          else
            header="All changes"
            body=$(git log --oneline)
          fi
          gh release create "$tag" artifacts/manifest.json artifacts/packs/*.tar.gz \
            --title "$tag" \
            --notes "## $header"$'\n\n'"$body"
          echo "created release $tag with manifest.json + pack tarballs"

      - name: Self-test the new release
        if: ${{ steps.detect.outputs.release == '1' }}
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          # releases/latest lags the just-created release for a few seconds — the
          # self-test installs via releases/latest, so let the pointer settle first
          sleep 20
          t=$(mktemp -d)
          gh release download "$tag" --dir "$t" --pattern 'manifest.json' --pattern '*.tar.gz'
          # manifest sanity: schema, release tag, one entry per pack with all fields
          python3 - "$t/manifest.json" "$tag" <<'PY'
          import json, sys
          manifest, tag = json.load(open(sys.argv[1])), sys.argv[2]
          assert manifest["schema"] == 1, manifest
          assert manifest["release"] == tag, manifest
          assert manifest["packs"], "manifest lists no packs"
          for name, e in manifest["packs"].items():
              for k in ("version", "description", "asset", "sha256"):
                  assert e.get(k), f"{name}: missing {k}"
              assert e["asset"] == f"{name}.tar.gz", e
          print(f"ok: manifest schema=1 release={tag} packs={sorted(manifest['packs'])}")
          PY
          # every tarball's sha256 matches its manifest entry
          python3 - "$t/manifest.json" "$t" <<'PY'
          import hashlib, json, os, sys
          manifest, dir_ = json.load(open(sys.argv[1])), sys.argv[2]
          for name, e in manifest["packs"].items():
              p = os.path.join(dir_, e["asset"])
              h = hashlib.sha256(open(p, "rb").read()).hexdigest()
              assert h == e["sha256"], f"{name}: sha256 mismatch"
          print("ok: all tarball checksums match the manifest")
          PY
          # payload hygiene: no repo-only paths, and the pack installer + vendored lib ship
          for tb in "$t"/*.tar.gz; do
            name=$(basename "$tb" .tar.gz)
            if tar -tzf "$tb" | grep -Eq "(^|/)${name}/(scripts|docs)/|(^|/)${name}/(README|AGENTS)\.md|(^|/)plugins/[^/]+/test/|node_modules|(^|/)(\.agent|__pycache__)/"; then
              echo "FAIL: $name tarball carries repo-only paths:" >&2
              tar -tzf "$tb" | grep -E "(^|/)${name}/(scripts|docs)/|(^|/)${name}/(README|AGENTS)\.md|(^|/)plugins/[^/]+/test/|node_modules|(^|/)(\.agent|__pycache__)/" >&2
              exit 1
            fi
            for f in "$name/install.sh" "$name/install-lib.sh" "$name/pack.conf"; do
              tar -tzf "$tb" | grep -qxF "$f" || { echo "FAIL: $name tarball missing $f" >&2; exit 1; }
            done
          done
          echo "ok: tarballs are payload-only and carry install.sh + install-lib.sh + pack.conf"
          # non-interactive install of each changed pack from the new release (latest flow)
          # into a mktemp dest, plus the PACK@<tag> pinned flow
          for p in ${{ steps.detect.outputs.packs }}; do
            prefix=$( (unset PACK_META_PREFIX; . "packs/$p/pack.conf"; printf '%s' "$PACK_META_PREFIX") )
            sh install.sh --release --dest "$t/cfg-$p" "$p" >/dev/null
            [ -f "$t/cfg-$p/$prefix.manifest" ] || { echo "FAIL: $p: no $prefix.manifest" >&2; exit 1; }
            want=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["packs"][sys.argv[2]]["version"])' "$t/manifest.json" "$p")
            got=$(cat "$t/cfg-$p/$prefix.version")
            [ "$got" = "$want" ] || { echo "FAIL: $p: version '$got' != manifest '$want'" >&2; exit 1; }
            sh install.sh --release --dest "$t/cfgv-$p" "$p@$tag" >/dev/null
            [ "$(cat "$t/cfgv-$p/$prefix.version")" = "$want" ] || { echo "FAIL: $p@$tag version mismatch" >&2; exit 1; }
            echo "ok: $p installed from release $tag (latest + @$tag), version $want"
          done
          sh install.sh --release --list | grep -q 'open-driver'
          echo "self-test OK: release $tag verifies and installs"
