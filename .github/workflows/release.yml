name: release

# Manual-only release pipeline:
#   1. validate the repo (./scripts/validate.sh — root dispatcher: install.sh syntax,
#      pack.conf sanity, opencode pack agent-scripts tests, every pack's validators)
#   2. compute the tag (auto patch-bump from latest v* tag, or the `version` input)
#   3. tag + push main
#   4. build agent-packs.tar.gz + agent-packs.tar.gz.sha256 (the installer's asset
#      convention: one top-level agent-packs/ dir with packs/ install.sh LICENSE),
#      plus a legacy opencode-agents.tar.gz (old layout) + SHA256SUMS so
#      pre-rename installers still served from the old raw URL keep working
#   5. create the GitHub release with an auto changelog
#   6. self-test: download the new release, verify checksums, diff against checkout,
#      run install.sh --release into a temp dir, and run the PREVIOUS tag's
#      install.sh against the legacy assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version as vX.Y.Z (or X.Y.Z). Empty = auto-increment patch from the latest tag."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install node for driver-viz tests
        uses: actions/setup-node@v5
        with:
          node-version: "22" # validate.sh needs >= 22.18 to strip TS types without a flag

      - name: Install validation deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ruby

      - name: Validate repository
        run: ./scripts/validate.sh

      - name: Compute release version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -eu
          git fetch --tags --force
          latest=$(git tag -l 'v*' | sort -V | tail -n 1 || true)

          normalize() { # any vX.Y / vX.Y.Z / X.Y.Z -> vX.Y.Z
            local v="${1#v}"
            case "$v" in
              [0-9]*.[0-9]*.[0-9]*) printf 'v%s\n' "$v" ;;
              [0-9]*.[0-9]*)       printf 'v%s.0\n' "$v" ;;
              *) return 1 ;;
            esac
          }

          if [ -n "$VERSION_INPUT" ]; then
            if ! printf '%s' "$VERSION_INPUT" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "invalid version '$VERSION_INPUT': must be vX.Y.Z or X.Y.Z" >&2
              exit 1
            fi
            new=$(normalize "$VERSION_INPUT")
            if git rev-parse -q --verify "refs/tags/$new" >/dev/null 2>&1; then
              echo "tag $new already exists" >&2
              exit 1
            fi
            if [ -n "$latest" ]; then
              latest_n=$(normalize "$latest")
              if [ "$new" = "$latest_n" ] || [ "$new" = "$(printf '%s\n%s\n' "$latest_n" "$new" | sort -V | head -n 1)" ]; then
                echo "$new is not greater than the latest tag $latest_n" >&2
                exit 1
              fi
            fi
          else
            if [ -n "$latest" ]; then
              latest_n=$(normalize "$latest")
              set -- $(printf '%s' "${latest_n#v}" | tr '.' ' ')
              new="v$1.$2.$(( $3 + 1 ))"
            else
              new="v0.1.0"
            fi
          fi

          echo "latest=${latest:-none}" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "new tag: $new (latest was: ${latest:-none})"

      - name: Create and push tag
        id: tag
        run: |
          set -eu
          tag="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists — aborting" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pushed tag $tag"

      - name: Build release artifacts
        run: |
          set -eu
          stage_root=$(mktemp -d)
          mkdir -p "$stage_root/agent-packs"
          # -L dereferences symlinked placeholder agents (plan-thorough.md)
          cp -RL packs install.sh LICENSE "$stage_root/agent-packs/"
          # strip repo-only dev files from every pack: scripts/, docs/, pack-level
          # README.md/AGENTS.md (the payload ships packs/README.md + pack.conf + payload dirs)
          find "$stage_root/agent-packs/packs" -mindepth 2 -maxdepth 2 \
            \( -name scripts -o -name docs -o -name README.md -o -name AGENTS.md \) \
            -prune -exec rm -rf {} +
          # plugin test dirs are repo-only too: OpenCode loads a plugin's entry file
          # only, tests are never needed at runtime
          find "$stage_root/agent-packs/packs" -type d -path '*/plugins/*' -name test \
            -prune -exec rm -rf {} +
          # strip any gitignored .agent/ (legacy driver history), __pycache__/ and
          # node_modules/ from the payload: OpenCode discovers agents/**/*.md
          # recursively, so shipped .agent/*.md would be installed and registered as
          # agents ("agents/.agent/history" etc.)
          find "$stage_root/agent-packs" -type d \( -name .agent -o -name __pycache__ -o -name node_modules \) -prune -exec rm -rf {} +
          tar -czf agent-packs.tar.gz -C "$stage_root" agent-packs
          sha256sum agent-packs.tar.gz > agent-packs.tar.gz.sha256
          cat agent-packs.tar.gz.sha256
          echo "artifacts: $(tar -tzf agent-packs.tar.gz | wc -l) files"

          # Legacy alias for pre-rename installers: the old raw URL
          # (…/opencode-agents/main/install.sh) can still serve the OLD install.sh,
          # which downloads opencode-agents.tar.gz + SHA256SUMS and expects a top-level
          # opencode-agents/ dir with agents/ commands/ skills/ agent-scripts/ plugins/.
          # Compose that old-layout tarball from the new packs/ layout.
          # SHA256SUMS must list ONLY the legacy asset — the old installer runs
          # `sha256sum -c SHA256SUMS` with just that file downloaded.
          mkdir -p "$stage_root/opencode-agents/skills"
          cp -RL packs/opencode/agents packs/opencode/commands packs/opencode/plugins packs/opencode/snippets install.sh LICENSE "$stage_root/opencode-agents/"
          cp -RL packs/opencode/skills/driver-conventions "$stage_root/opencode-agents/skills/"
          cp -RL packs/opencode/agent-scripts "$stage_root/opencode-agents/agent-scripts"
          find "$stage_root/opencode-agents" -type d \( -name .agent -o -name __pycache__ -o -name node_modules \) -prune -exec rm -rf {} +
          tar -czf opencode-agents.tar.gz -C "$stage_root" opencode-agents
          sha256sum opencode-agents.tar.gz > SHA256SUMS
          cat SHA256SUMS
          echo "legacy artifacts: $(tar -tzf opencode-agents.tar.gz | wc -l) files"

      - name: Create GitHub release
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          latest="${{ steps.version.outputs.latest }}"
          if [ "$latest" != "none" ]; then
            header="Changes since $latest"
            body=$(git log --oneline "${latest}..HEAD")
          else
            header="All changes"
            body=$(git log --oneline)
          fi
          gh release create "$tag" agent-packs.tar.gz agent-packs.tar.gz.sha256 opencode-agents.tar.gz SHA256SUMS \
            --title "$tag" \
            --notes "## $header"$'\n\n'"$body"
          echo "created release $tag"

      - name: Self-test the new release
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          # releases/latest lags the just-created release for a few seconds — the
          # self-test installs via releases/latest, so let the pointer settle first
          sleep 20
          t=$(mktemp -d)
          gh release download "$tag" --dir "$t" --pattern '*.tar.gz' --pattern '*.sha256' --pattern SHA256SUMS
          (cd "$t" && sha256sum -c agent-packs.tar.gz.sha256 && sha256sum -c SHA256SUMS)
          # the payload must not carry repo-only pack dev files or bytecode dirs
          # (patterns anchored with (^|/) so the top-level "agent-packs/" dir name
          # itself cannot match; packs/README.md — the pack contract — ships on purpose)
          if tar -tzf "$t/agent-packs.tar.gz" | grep -Eq '(^|/)packs/[^/]+/(scripts|docs)/|(^|/)packs/[^/]+/plugins/.*/test/|node_modules|(^|/)(\.agent|__pycache__)/|(^|/)packs/[^/]+/(README|AGENTS)\.md'; then
            echo "FAIL: payload carries dev files or .agent/__pycache__/node_modules" >&2
            tar -tzf "$t/agent-packs.tar.gz" | grep -E '(^|/)packs/[^/]+/(scripts|docs)/|(^|/)packs/[^/]+/plugins/.*/test/|node_modules|(^|/)(\.agent|__pycache__)/|(^|/)packs/[^/]+/(README|AGENTS)\.md' >&2
            exit 1
          fi
          # the legacy alias must be the OLD layout (top-level opencode-agents/ with
          # agents/ commands/ skills/ agent-scripts/ plugins/) for pre-rename installers
          tar -tzf "$t/opencode-agents.tar.gz" > "$t/legacy-list"
          for f in agents/driver.md commands/driver.md skills/driver-conventions/SKILL.md agent-scripts/driver-state.py plugins/driver-viz/tui.tsx; do
            grep -qxF "opencode-agents/$f" "$t/legacy-list" || { echo "FAIL: legacy tarball missing opencode-agents/$f" >&2; exit 1; }
          done
          tar -xzf "$t/agent-packs.tar.gz" -C "$t"
          # installed payload must match the checkout (payload dirs)
          diff -r --exclude=.agent --exclude=__pycache__ "$t/agent-packs/packs/opencode/agents" packs/opencode/agents
          diff -r --exclude=.agent --exclude=__pycache__ "$t/agent-packs/packs/opencode/commands" packs/opencode/commands
          diff -r --exclude=.agent --exclude=__pycache__ --exclude=test "$t/agent-packs/packs/opencode/plugins" packs/opencode/plugins
          diff -r --exclude=.agent --exclude=__pycache__ "$t/agent-packs/packs/opencode/snippets" packs/opencode/snippets
          # the vibe-acp pack ships its payload (pack.conf + plugins/ + snippets/)
          diff -r --exclude=.agent --exclude=__pycache__ --exclude=test "$t/agent-packs/packs/vibe-acp/plugins" packs/vibe-acp/plugins
          diff -r --exclude=.agent --exclude=__pycache__ "$t/agent-packs/packs/vibe-acp/snippets" packs/vibe-acp/snippets
          test -f "$t/agent-packs/packs/vibe-acp/pack.conf"
          # vibe-acp installs from the release payload into a throwaway config dir
          sh install.sh --release --dest "$t/cfg-vibe" vibe-acp >/dev/null
          test -f "$t/cfg-vibe/plugins/vibe-acp/index.ts"
          test -f "$t/cfg-vibe/plugins/vibe-acp/provider/src/index.ts"
          test -f "$t/cfg-vibe/agent-packs.vibe-acp.manifest"
          test ! -e "$t/cfg-vibe/snippets"
          sh install.sh --release --list | grep -q 'vibe-acp'
          # the vibe-skills pack ships its skills/ payload (pack.conf + skills/; scripts/ + docs/ stripped)
          diff -r --exclude=.agent --exclude=__pycache__ "$t/agent-packs/packs/vibe-skills/skills" packs/vibe-skills/skills
          test -f "$t/agent-packs/packs/vibe-skills/pack.conf"
          test ! -e "$t/agent-packs/packs/vibe-skills/scripts"
          test ! -e "$t/agent-packs/packs/vibe-skills/docs"
          # vibe-skills installs from the release payload into a throwaway Vibe home
          sh install.sh --release --dest "$t/cfg-vibe-skills" vibe-skills >/dev/null
          test -f "$t/cfg-vibe-skills/skills/manage-vibe-skills/SKILL.md"
          test -f "$t/cfg-vibe-skills/agent-packs.vibe-skills.manifest"
          test ! -e "$t/cfg-vibe-skills/scripts"
          sh install.sh --release --list | grep -q 'vibe-skills'
          diff -r --exclude=.agent --exclude=__pycache__ "$t/agent-packs/packs/opencode/agent-scripts" packs/opencode/agent-scripts
          diff -r --exclude=.agent --exclude=__pycache__ "$t/agent-packs/packs/opencode/skills/driver-conventions" packs/opencode/skills/driver-conventions
          # full installer path: download payload, verify checksum, install into temp dir
          # (ubuntu-latest has python3 + git preinstalled, so the prereq check passes)
          sh install.sh --release --dest "$t/cfg" opencode
          test -f "$t/cfg/agents/driver.md"
          test -f "$t/cfg/plugins/driver-viz/tui.tsx"
          test -f "$t/cfg/skills/driver-conventions/SKILL.md"
          test -f "$t/cfg/agent-scripts/detect-forge.sh"
          test -f "$t/cfg/agent-scripts/driver-state.py"
          test -f "$t/cfg/agent-scripts/save-linear-attachments.py"
          test -f "$t/cfg/agent-scripts/qa-command.sh"
          test -f "$t/cfg/agent-packs.opencode.manifest"
          test -f "$t/cfg/agent-packs.opencode.version"
          # snippets/ is ship-only — it must NOT be installed
          test ! -e "$t/cfg/snippets"
          # the payload must not carry .agent/ or __pycache__/ (they would be
          # discovered as agents / are bytecode junk)
          test -z "$(find "$t/cfg" -type d \( -name .agent -o -name __pycache__ \) -print -quit)"
          ! grep -Eq '(^|/)(\.agent|__pycache__)/' "$t/cfg/agent-packs.opencode.manifest"
          # --list shows the pack
          sh install.sh --release --list | grep -q 'opencode'
          # legacy pre-rename manifest is cleaned up once
          printf 'agents/gone.md\n' > "$t/cfg/opencode-agents.manifest"
          echo x > "$t/cfg/agents/gone.md"
          printf 'v0.0.0\n' > "$t/cfg/opencode-agents.version"
          sh install.sh --release --dest "$t/cfg" opencode >/dev/null
          test ! -e "$t/cfg/agents/gone.md"
          test ! -e "$t/cfg/opencode-agents.manifest"
          test ! -e "$t/cfg/opencode-agents.version"
          # legacy path: the last PRE-RENAME install.sh (REPO=opencode-agents, still
          # served from the old raw URL) must keep working end-to-end via the old repo
          # name (release URLs redirect) + the legacy opencode-agents.tar.gz asset
          old_tag=$(git tag -l 'v*' | sort -rV | while read -r tg; do
            if git show "$tg:install.sh" 2>/dev/null | grep -q 'REPO="GoncaloJoaoCorreia/opencode-agents"'; then
              printf '%s\n' "$tg"; break
            fi
          done)
          if [ -n "$old_tag" ]; then
            git show "${old_tag}:install.sh" > "$t/old-install.sh"
            sh "$t/old-install.sh" --release --dest "$t/cfg-old" >/dev/null
            test -f "$t/cfg-old/agents/driver.md"
            test -f "$t/cfg-old/skills/driver-conventions/SKILL.md"
            test -f "$t/cfg-old/agent-scripts/driver-state.py"
            test -f "$t/cfg-old/opencode-agents.manifest"
            test -f "$t/cfg-old/opencode-agents.version"
            echo "legacy pre-rename installer (tag $old_tag) still installs from the $tag assets"
          else
            echo "note: no pre-rename tag found — skipping legacy installer self-test"
          fi
          echo "self-test OK: release $tag verifies and installs"
